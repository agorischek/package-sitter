version: 2

updates:
  - package-ecosystem: npm
    directories:
      - "/fixtures/*"
    schedule:
      interval: daily
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
      exclude:
        - "@e-n-v/env"
        - apposite
        - badge-roll
        - becomes
        - check-1-2
        - correlation-vector
        - dollarlint
        - elementory
        - emj
        - fill-in-the-blank
        - jest-joi
        - louk
        - markdown-it
        - markunit
        - multigrain
        - semantic-expect
        - sibylline
        - verify-repo
    versioning-strategy: increase
    open-pull-requests-limit: 25

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
