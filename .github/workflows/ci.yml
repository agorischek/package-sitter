name: Deploy package-sitter checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Select fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fixtures: ${{ steps.fixtures.outputs.fixtures }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected fixtures
        id: fixtures
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: echo "fixtures=$(node scripts/select-fixtures.mjs)" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke ${{ matrix.fixture }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        fixture: ${{ fromJSON(needs.prepare.outputs.fixtures) }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: fixtures/${{ matrix.fixture }}/package-lock.json

      - name: Install fixture
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: npm ci --ignore-scripts --prefix "fixtures/$FIXTURE"

      - name: Audit fixture
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: npm audit --audit-level=high --omit=dev --prefix "fixtures/$FIXTURE"

      - name: Smoke test fixture
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: npm test --prefix "fixtures/$FIXTURE"

  verify:
    name: Verify
    if: ${{ always() }}
    needs:
      - prepare
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Confirm all fixtures passed
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$SMOKE_RESULT" = success
